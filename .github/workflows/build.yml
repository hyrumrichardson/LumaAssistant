name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and validates the wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6

      # The Google Home APIs SDK can't be downloaded in CI, so this builds Luma with the stub
      # smart-home backend. Timers, navigation and the parser are fully covered.
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: luma-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
