name: Release

# Push a tag like v0.1.0 (matching luma.versionName in gradle.properties) to publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The release key's fingerprint. Public; the README lists it so users can check their copy.
      EXPECTED_CERT_SHA256: 3bfe7b802f217e77070a1818f09986dc1ed0ac5100aa91ce625147b85444a8bc

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          version=$(grep -E '^luma.versionName=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match luma.versionName=$version in gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Checked up front so a bad secret fails in seconds, with a message saying which one.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUMA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Set both LUMA_KEYSTORE_BASE64 and LUMA_KEYSTORE_PASSWORD (see the README's Releasing section)"
            exit 1
          fi
          keystore="$RUNNER_TEMP/luma-release.jks"
          # Pasted secrets often pick up line breaks or spaces; neither belongs in these values.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"; then
            echo "::error::LUMA_KEYSTORE_BASE64 isn't valid base64. Paste the whole of keystore-base64.txt."
            exit 1
          fi
          password=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')
          password=${password#luma.keystore.password=}
          echo "::add-mask::$password"
          if ! keytool -list -keystore "$keystore" -storepass "$password" -alias luma > /dev/null 2>&1; then
            echo "::error::LUMA_KEYSTORE_PASSWORD doesn't open the keystore (or LUMA_KEYSTORE_BASE64 is the wrong file). Use only the part after luma.keystore.password= in ~/.gradle/gradle.properties."
            exit 1
          fi
          echo "LUMA_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "LUMA_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"

      # Public releases never include the Google Home SDK; see the README for building with it.
      # AGP only creates unit tests for the debug build; they cover the same (pure Kotlin) code.
      - name: Test, lint and build the signed release
        run: |
          ./gradlew -Pluma.homeApis=false testDebugUnitTest lintRelease assembleRelease --console=plain || {
            echo "::error::The Gradle build failed. Open this step's log for the details."
            exit 1
          }

      - name: Verify the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::No signed APK was built"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $apksigner"
          "$apksigner" verify --print-certs "$apk" > signature.txt 2>&1 || true
          cat signature.txt
          if ! tr -d ':' < signature.txt | grep -qi "$EXPECTED_CERT_SHA256"; then
            # Put apksigner's output in the annotation, which is readable without opening the log.
            echo "::error::The APK isn't signed with Luma's release key. apksigner said: $(grep -i -E 'signer|error|warning' signature.txt | head -6 | tr '\n' '|')"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="luma-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          {
            echo "Signing certificate SHA-256: \`$EXPECTED_CERT_SHA256\`"
            echo
            echo "This build doesn't include Google Home device control. See the README to build Luma with it."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --title "Luma $GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag || {
            echo "::error::Couldn't create the GitHub release. If one already exists for $GITHUB_REF_NAME, delete it first."
            exit 1
          }

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/luma-release.jks"
