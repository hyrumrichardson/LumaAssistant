name: Release

# Push a tag like v0.1.0 (matching luma.versionName in gradle.properties) to publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          version=$(grep -E '^luma.versionName=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match luma.versionName=$version in gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The LUMA_KEYSTORE_BASE64 secret isn't set (see the README's Releasing section)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luma-release.jks"

      # Public releases never include the Google Home SDK; see the README for building with it.
      - name: Test, lint and build the signed release
        env:
          LUMA_KEYSTORE_FILE: ${{ runner.temp }}/luma-release.jks
          LUMA_KEYSTORE_PASSWORD: ${{ secrets.LUMA_KEYSTORE_PASSWORD }}
        # AGP only creates unit tests for the debug build; they cover the same (pure Kotlin) code.
        run: ./gradlew -Pluma.homeApis=false testDebugUnitTest lintRelease assembleRelease --console=plain

      - name: Verify the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::No signed APK was built"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee signature.txt
          grep -q "Signer #1 certificate DN: CN=Luma" signature.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="luma-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cert=$(grep "certificate SHA-256 digest" signature.txt | head -1 | awk '{print $NF}')
          {
            echo "Signing certificate SHA-256: \`$cert\`"
            echo
            echo "This build doesn't include Google Home device control. See the README to build Luma with it."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --title "Luma $GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/luma-release.jks"
